[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cache-usage"
version = "0.1.0"
description = "Parse, merge, and cost LLM providers' prompt-cache usage fields correctly"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cache_usage"]
